Categories:
  - Science & Education
License: MIT
AuthorName: Bürgerweg contributors
SourceCode: https://github.com/elnurastanov/burgerweg
IssueTracker: https://github.com/elnurastanov/burgerweg/issues
WebSite: https://astanov.com/burgerweg/

AutoName: Bürgerweg

RepoType: git
Repo: https://github.com/elnurastanov/burgerweg.git

Builds:
  - versionName: 1.2.0
    versionCode: 4
    commit: v1.2.0
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y -t bookworm-backports nodejs npm
    init:
      - cd ../..
      - npm ci --ignore-scripts
      - EXPO_NO_TELEMETRY=1 EXPO_PUBLIC_WEB_APP_URL=https://astanov.com/burgerweg/app npx expo prebuild -p android --no-install
    gradle:
      - yes
    scanignore:
      - node_modules

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: app.json|"versionCode":\s*(\d+)|app.json|"version":\s*"([\d.]+)"
CurrentVersion: 1.2.0
CurrentVersionCode: 4
