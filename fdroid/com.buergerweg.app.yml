License: MIT
AuthorName: Bürgerweg contributors
WebSite: https://astanov.com/burgerweg/
SourceCode: https://github.com/elnurastanov/burgerweg
IssueTracker: https://github.com/elnurastanov/burgerweg/issues

AutoName: Bürgerweg

RepoType: git
Repo: https://github.com/elnurastanov/burgerweg.git

Builds:
  - versionName: 1.3.0
    versionCode: 6
    commit: v1.3.0
    sudo:
      - curl -Lo node.tar.gz https://nodejs.org/dist/v24.22.2/node-v24.22.2-linux-x64.tar.gz
      - echo "361718c444e49af2ca5a110c83ba6a8901143f23ab285ebbef0341f391f482a9 node.tar.gz"
        | sha256sum -c -
      - tar xzf node.tar.gz --strip-components=1 -C /usr/local/
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - echo "deb https://deb.debian.org/debian-security bookworm-security main" >>
        /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm-security openjdk-17-jdk-headless
      - update-java-alternatives -s java-1.17.0-openjdk-amd64
    init:
      - npm ci --ignore-scripts
      - npx expo prebuild -p android --no-install
      - sed -i.bak '/release {/,/}/{/signingConfig/d;}' android/app/build.gradle
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild: sdkmanager 'cmake;3.22.1'
    scanignore:
      - node_modules
    build: cd android && gradle assembleRelease
    ndk: r27b

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: app.json|"versionCode":\s*(\d+)||
CurrentVersion: 1.3.0
CurrentVersionCode: 6
